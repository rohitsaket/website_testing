name: WTE CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:only
      - name: CLI smoke (self-scan of a local fixture would require a service; validate CLI surface instead)
        run: node dist/src/cli.js | grep -q "WTE Platform CLI"
